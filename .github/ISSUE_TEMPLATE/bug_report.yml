name: Bug Report
description: Something isn't working
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Rafters version
      description: Output of `pnpx rafters --version`
      placeholder: "0.0.16"
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - CLI (rafters)
        - Studio
        - Design Tokens
        - UI Components
        - Color Utils
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS, Node version, framework, anything relevant
